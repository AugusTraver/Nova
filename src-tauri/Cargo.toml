[package]
name = "nova"
version = "0.1.0"
description = "Panel personal con asistente de IA"
authors = ["AugusTraver"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.1"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "http2", "charset", "multipart"] }
keyring-core = "1"
# Temporizadores de la tarea de fondo. Tauri ya trae tokio adentro; esto solo
# habilita la parte de tiempo y sincronización para usarla directo.
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util"] }
feed-rs = "3.0.0"
# Validar direcciones (v0.7.1). Ya venía adentro de reqwest: no suma nada nuevo.
url = "2"
cpal = "0.18.2"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
# "Oye Nova": modelo ONNX chiquito que corre en Rust puro (sin ONNX Runtime).
livekit-wakeword = "0.2"


# Compilar más rápido en desarrollo: de Nova solo se guardan las líneas (los
# errores siguen diciendo archivo y línea) y de las librerías, nada. Eso
# achica mucho el .exe de desarrollo y lo que tarda en armarse.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# El modelo de "Oye Nova" sin optimizar tarda más que el audio en tiempo
# real: en desarrollo se compila optimizado (solo estas librerías).
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.ort-tract]
opt-level = 3
[profile.dev.package.livekit-wakeword]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1"
# Avisos de Windows que abren el panel al tocarlos (v0.6).
tauri-winrt-notification = "0.7"
# Saber si la sesión está bloqueada o la compu va a batería (pausar "Oye Nova").
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops", "Win32_System_Power"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
